# Publica el sitio en Firebase Hosting (va-home-d3708) con cada push a main, a mano (Run workflow)
# o cuando el panel /admin pide «Publicar cambios en la web» (vía el Worker de Cloudflare).
# Requiere el secret FIREBASE_SERVICE_ACCOUNT: JSON de una cuenta de servicio con roles
# Firebase Hosting Admin, Firebase Rules Admin y Service Usage Consumer.
name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

# Configuración web de Firebase: son claves públicas del cliente; la seguridad la dan firestore.rules.
env:
  NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAvXBZTYZHGa8Rzsf-N25BbyXBeL-UkAnY
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: va-home-d3708.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: va-home-d3708
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:865387192596:web:58587e63331af4f0806201"
  # URL del Worker de avisos y publicación (vacía = sin avisos por correo ni botón de publicar).
  NEXT_PUBLIC_WORKER_URL: ${{ vars.WORKER_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Reglas primero: los formularios nuevos y la lectura del inventario dependen de ellas.
      - name: Publicar reglas e índices de Firestore
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --only firestore:rules,firestore:indexes --project va-home-d3708 --non-interactive
          rm "$RUNNER_TEMP/sa.json"
      - run: node scripts/fetch-inventory.mjs
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: va-home-d3708
          channelId: live
